name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shulker-preview1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: gradlew ausführbar machen
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: shulker-preview-jar
          path: shulker-preview1/build/libs/*.jar
