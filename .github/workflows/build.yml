name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Projektordner finden
        run: |
          DIR=$(dirname "$(find . -name gradlew -not -path './.git/*' | head -n 1)")
          echo "Projektordner: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: shulker-preview-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
